name: Bug Report
description: File a bug report
title: "[BUG] "
labels: ["bug"]
assignees:
  - mackysoft
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Navigathena version and adapters
      description: Include the Navigathena NuGet package versions, the adapters in use, and any external Unity dependencies.
      placeholder: e.g. 2.0.0-preview.1, Unity + uGUI + VContainer
    validations:
      required: true
  - type: input
    id: unity-version
    attributes:
      label: Unity Version
      description: For Unity projects, include the Editor version and scripting backend. For .NET-only projects, include the .NET runtime version instead.
      placeholder: e.g. Unity 6000.5.5f1, Mono / IL2CPP
