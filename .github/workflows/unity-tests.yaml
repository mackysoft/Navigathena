name: Unity behavior tests

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
      build-documentation:
        type: boolean
        default: false
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Unity behavior tests (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - unity-6
          - unity-2021
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: artifacts/packages
      - name: Restore release packages for the Unity tests
        run: bash scripts/prepare-unity.sh artifacts/packages '${{ matrix.configuration }}'
      - name: Run Unity PlayMode tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # v4.4.0 emits an unsupported negated CLI flag for coverageEnabled: false.
          # Use the CLI's supported environment option instead.
          GAME_CI_COVERAGE_ENABLED: 'false'
        with:
          cliVersion: v0.1.69
          projectPath: artifacts/unity-project
          testMode: PlayMode
          customParameters: ${{ inputs.build-documentation && matrix.configuration == 'unity-6' && '-exportDocfxProjects' || '' }}
          artifactsPath: artifacts/unity-results/playmode
          githubToken: ''
      - name: Require successful adapter test results
        run: dotnet run --project eng/RepositoryTools --configuration Release -- verify-unity-results artifacts/unity-results/playmode
      - name: Build public documentation
        if: inputs.build-documentation && matrix.configuration == 'unity-6'
        run: |
          # Unity runs in a root-owned container; DocFX runs as the host runner.
          sudo chown -R "$(id -u):$(id -g)" artifacts/documentation
          bash scripts/build-documentation.sh
      - name: Upload public documentation
        if: inputs.build-documentation && matrix.configuration == 'unity-6'
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: artifacts/documentation/site
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unity-test-results-${{ matrix.configuration }}
          path: artifacts/unity-results
          if-no-files-found: warn
