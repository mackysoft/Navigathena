name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs['package-version'] }}
      sha: ${{ steps.source.outputs['release-sha'] }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
      - name: Guard release source
        id: source
        uses: mackysoft/actions/release/source-guard@5bd02b67aaf373c23e871c8a6cf79e19652bbc9b
        with:
          tag-name: ${{ github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
      - name: Validate configured version
        env:
          RELEASE_VERSION: ${{ steps.source.outputs['package-version'] }}
        run: |
          set -euo pipefail
          configured_version="$(dotnet msbuild src/MackySoft.Navigathena/MackySoft.Navigathena.csproj -nologo -getProperty:PackageVersion)"
          if [[ "$configured_version" != "$RELEASE_VERSION" ]]; then
            printf 'Release tag must match Directory.Build.props: configured %s, tag %s\n' "$configured_version" "$RELEASE_VERSION" >&2
            exit 1
          fi
      - name: Verify and package
        run: bash scripts/verify.sh --package-output artifacts/packages
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/upgrade-baseline/*.nupkg
          if-no-files-found: error

  unity:
    needs: package
    uses: ./.github/workflows/unity-tests.yaml
    with:
      source-ref: ${{ needs.package.outputs.sha }}
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

  publish:
    needs: [package, unity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.package.outputs.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: artifacts/packages
      - name: Guard published source
        uses: mackysoft/actions/release/source-guard@5bd02b67aaf373c23e871c8a6cf79e19652bbc9b
        with:
          tag-name: ${{ github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          expected-release-sha: ${{ needs.package.outputs.sha }}
      - name: Validate package artifacts
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_SHA: ${{ needs.package.outputs.sha }}
        run: python3 scripts/verify-package-contents.py artifacts/packages "$PACKAGE_VERSION" "$RELEASE_SHA"
      - name: Inspect publication state
        id: packages
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: python3 scripts/publication.py prepare artifacts/packages "$PACKAGE_VERSION" artifacts/pending
      - name: Require NuGet account configuration
        if: steps.packages.outputs['publish-required'] == 'true'
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          set -euo pipefail
          if [[ -z "$NUGET_USER" ]]; then
            printf 'Set the repository variable NUGET_USER to the NuGet.org account with a Trusted Publisher policy for mackysoft/Navigathena and release.yaml.\n' >&2
            exit 1
          fi
      - name: Publish NuGet packages
        if: steps.packages.outputs['publish-required'] == 'true'
        uses: mackysoft/actions/nuget/trusted-publish@5bd02b67aaf373c23e871c8a6cf79e19652bbc9b
        with:
          package-glob: artifacts/pending/*.nupkg
          nuget-user: ${{ vars.NUGET_USER }}
      - name: Wait for package availability
        uses: mackysoft/actions/nuget/package-state@5bd02b67aaf373c23e871c8a6cf79e19652bbc9b
        with:
          mode: wait
          package-version: ${{ needs.package.outputs.version }}
          package-ids: |
            MackySoft.Navigathena
            MackySoft.Navigathena.MicrosoftDI
            MackySoft.Navigathena.Unity
            MackySoft.Navigathena.Unity.UGUI
            MackySoft.Navigathena.Unity.UIToolkit
            MackySoft.Navigathena.Unity.Addressables
            MackySoft.Navigathena.VContainer
          max-attempts: 90
          interval-seconds: 10
      - name: Download and verify published packages
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_SHA: ${{ needs.package.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/publication.py verify artifacts/packages "$PACKAGE_VERSION" artifacts/published
          python3 scripts/verify-package-contents.py artifacts/published "$PACKAGE_VERSION" "$RELEASE_SHA"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/published/*.nupkg --clobber
          else
            release_options=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_options+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" artifacts/published/*.nupkg "${release_options[@]}"
          fi
